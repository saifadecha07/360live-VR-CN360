###############################################################
# Docker Compose — CN360Live MediaMTX Relay
# รันบน VPS/server แยกจาก Vercel
#
# วิธีใช้:
#   cd relay
#   docker compose up -d
###############################################################

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cn360-relay
    restart: unless-stopped

    # ── PORT MAPPING ──────────────────────────────────────────
    ports:
      - "1935:1935"          # RTMP  ← Insta360 app ยิงมาที่นี่
      - "8888:8888"          # HLS   → browser ดึง .m3u8
      - "8889:8889"          # WebRTC signaling
      - "8189:8189/udp"      # WebRTC ICE UDP (media data)
      # พอร์ต 9997 (API) ไม่ expose สู่สาธารณะ — ใช้ภายใน network เท่านั้น

    # ── VOLUMES ───────────────────────────────────────────────
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

    # ── NETWORK ───────────────────────────────────────────────
    networks:
      - cn360net

  # ── CADDY (optional — uncomment เพื่อเปิด HTTPS) ────────────
  # caddy:
  #   image: caddy:alpine
  #   container_name: cn360-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - cn360net
  #   depends_on:
  #     - mediamtx

networks:
  cn360net:
    driver: bridge


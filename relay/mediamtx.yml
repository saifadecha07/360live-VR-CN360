###############################################################
# MediaMTX — CN360Live Local Relay Config
# กล้อง : Insta360 X5
#
# Flow:
#   Insta360 app  →  RTMP :1935/live/x5
#                 →  HLS  :8888/live/x5/index.m3u8   (latency ~3-5s)
#                 →  WebRTC :8889/live/x5             (latency ~1s)
###############################################################

logLevel: info

# ── RTMP — รับจาก Insta360 app ──────────────────────────────
rtmp: yes
rtmpAddress: :1935

# ── HLS — ขาออกสู่ browser ──────────────────────────────────
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsSegmentDuration: 1s
hlsPartDuration: 200ms      # Low-Latency HLS

# ── WebRTC — ขาออก latency ~1s ───────────────────────────────
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: "*"
webrtcICEUDPMuxAddress: :8189

# ── API — ใช้ health check (local only, ไม่ต้อง expose) ──────
api: yes
apiAddress: :9997

# ── PATH ─────────────────────────────────────────────────────
paths:
  live/x5:
    source: publisher
    # Phase 2: เพิ่ม publishUser/publishPass เพื่อป้องกัน

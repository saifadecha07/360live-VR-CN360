<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050A12" />
  <title>CN360Live · VR Camera System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       SCREEN 1 — HOME / MODE SELECTION
  ════════════════════════════════════════════════ -->
  <div id="screen-home" class="screen active">
    <div class="home-bg">
      <div class="home-grid"></div>
      <div class="home-glow"></div>
    </div>

    <div class="home-content">
      <header class="home-header">
        <div class="home-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00C6FF" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="2"  x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2"  y1="12" x2="6"  y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
          </svg>
          <span class="home-logo-text">CN360<span class="home-logo-accent">Live</span></span>
        </div>
        <p class="home-subtitle">LIVE 360° CAMERA SYSTEM</p>
      </header>

      <div class="mode-cards">

        <!-- PC MODE -->
        <button class="mode-card" id="btn-pc-mode">
          <div class="mode-card-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <div class="mode-card-body">
            <div class="mode-card-title">PC MODE</div>
            <div class="mode-card-desc">Watch Live 360°<br>on Browser</div>
          </div>
          <div class="mode-card-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </button>

        <!-- VR MODE -->
        <button class="mode-card mode-card--vr" id="btn-vr-mode">
          <div class="mode-card-badge" id="vr-badge">WebXR</div>
          <div class="mode-card-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M2 8h20v10a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/>
              <circle cx="8.5" cy="13" r="1.8" fill="currentColor" stroke="none"/>
              <circle cx="15.5" cy="13" r="1.8" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="mode-card-body">
            <div class="mode-card-title">VR MODE</div>
            <div class="mode-card-desc">Enter 3D Camera<br>Lobby</div>
          </div>
          <div class="mode-card-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </button>

      </div>

      <!-- Debug mode link — hidden unless ?debug=1 -->
      <div class="home-debug" id="home-debug-link" style="display:none">
        <button id="btn-debug-mode" class="home-debug-btn">⚙ DEVELOPER MODE</button>
      </div>

      <footer class="home-footer">
        <span id="home-relay-status" class="relay-status relay-status--unknown">● RELAY OFFLINE</span>
      </footer>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       SCREEN 2 — PC MODE (Camera List + Viewer)
  ════════════════════════════════════════════════ -->
  <div id="screen-pc" class="screen">
    <!-- BACK BUTTON -->
    <button class="nav-back" id="pc-back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      HOME
    </button>

    <!-- CAMERA LIST PANEL -->
    <div id="pc-camera-list" class="pc-camera-list">
      <div class="pc-list-header">
        <h2 class="pc-list-title">SELECT CAMERA</h2>
        <div id="pc-poll-dot" class="poll-dot" title="Auto-refreshing"></div>
      </div>
      <div id="pc-cameras" class="pc-cameras">
        <div class="loading-state">
          <div class="spinner"></div>
          <span>Loading cameras…</span>
        </div>
      </div>
    </div>

    <!-- PC VIEWER PANEL (shown when camera selected) -->
    <div id="pc-viewer-panel" class="pc-viewer-panel hidden">
      <div class="pc-viewer-header">
        <button class="nav-back-inline" id="pc-viewer-back-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          CAMERA LIST
        </button>
        <div id="pc-viewer-status-bar">
          <div id="pc-status-dot" class="status-dot"></div>
          <span id="pc-status-text">360 VIEWER</span>
        </div>
        <div class="pc-viewer-controls">
          <button id="pc-fullscreen-btn" class="icon-btn" title="Fullscreen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 3 21 3 21 9"/>
              <polyline points="9 21 3 21 3 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
          </button>
          <button id="pc-vr-btn" class="icon-btn icon-btn--vr" title="Enter VR" style="display:none">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M2 8h20v10a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/>
              <circle cx="8.5" cy="13" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="15.5" cy="13" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Three.js canvas for PC viewer -->
      <canvas id="pc-canvas" class="viewer-canvas"></canvas>

      <!-- Error / retry overlay -->
      <div id="pc-viewer-overlay" class="viewer-overlay hidden">
        <div class="viewer-overlay-box">
          <div id="pc-overlay-icon" class="overlay-icon">
            <div class="spinner"></div>
          </div>
          <div id="pc-overlay-title" class="overlay-title">Connecting…</div>
          <div id="pc-overlay-msg"   class="overlay-msg"></div>
          <button id="pc-retry-btn" class="overlay-retry hidden">RETRY</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       SCREEN 3 — VR MODE (Three.js Lobby + Viewer)
  ════════════════════════════════════════════════ -->
  <div id="screen-vr" class="screen">
    <!-- Single canvas — used for lobby AND vr viewer -->
    <canvas id="vr-canvas" class="viewer-canvas"></canvas>

    <!-- VR LOBBY HUD (shown when in lobby) -->
    <div id="vr-lobby-hud" class="vr-lobby-hud">
      <div class="vr-hud-header">
        <span class="vr-hud-logo">CN360<span style="color:#00C6FF">Live</span></span>
        <button class="nav-back-inline" id="vr-home-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          HOME
        </button>
      </div>
      <div class="vr-hud-title">CAMERA LOBBY</div>
      <div id="vr-lobby-hint" class="vr-hud-hint">Click a camera panel to connect</div>
      <div id="vr-lobby-loading" class="vr-hud-loading hidden">
        <div class="spinner spinner--sm"></div>
        <span>Loading cameras…</span>
      </div>
    </div>

    <!-- VR VIEWER HUD (shown when in 360 viewer) -->
    <div id="vr-viewer-hud" class="vr-viewer-hud hidden">
      <div class="vr-viewer-hud-bar">
        <div id="vr-viewer-cam-name" class="vr-viewer-cam-name">CAMERA 01</div>
        <div id="vr-viewer-status" class="vr-viewer-status">
          <div class="status-dot status-dot--live"></div>
          <span>LIVE</span>
        </div>
      </div>
      <div class="vr-viewer-hud-actions">
        <button id="vr-back-btn" class="vr-action-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          BACK TO LOBBY
        </button>
        <button id="vr-enter-xr-btn" class="vr-action-btn vr-action-btn--accent" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M2 8h20v10a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/>
            <circle cx="8.5" cy="13" r="1.3" fill="currentColor" stroke="none"/>
            <circle cx="15.5" cy="13" r="1.3" fill="currentColor" stroke="none"/>
          </svg>
          ENTER XR
        </button>
      </div>
    </div>

    <!-- VR viewer error overlay -->
    <div id="vr-viewer-overlay" class="viewer-overlay hidden">
      <div class="viewer-overlay-box">
        <div id="vr-overlay-icon" class="overlay-icon">
          <div class="spinner"></div>
        </div>
        <div id="vr-overlay-title" class="overlay-title">Connecting…</div>
        <div id="vr-overlay-msg"   class="overlay-msg"></div>
        <button id="vr-retry-btn" class="overlay-retry hidden">RETRY</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       SCREEN 4 — DEVELOPER MODE (debug=1)
  ════════════════════════════════════════════════ -->
  <div id="screen-dev" class="screen">
    <button class="nav-back" id="dev-back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      HOME
    </button>

    <!-- Canvas fills the full screen -->
    <canvas id="dev-canvas"></canvas>

    <!-- Controls panel floats at the bottom -->
    <div class="dev-panel">
      <div class="dev-panel-title">⚙ DEVELOPER MODE</div>

      <div class="dev-controls">
        <div class="dev-section-title">TEXTURE SOURCE</div>
        <div class="dev-btn-row">
          <button id="dev-default-btn"  class="dev-btn active">Default Panorama</button>
          <label  id="dev-upload-label" class="dev-btn">
            Upload Image
            <input type="file" id="dev-file-input" accept="image/*" style="display:none"/>
          </label>
        </div>

        <div class="dev-section-title" style="margin-top:16px">MANUAL STREAM URL</div>
        <div class="dev-url-row">
          <input type="url" id="dev-stream-url" placeholder="https://relay/live/x5/index.m3u8" />
          <button id="dev-connect-btn" class="dev-btn">CONNECT</button>
        </div>

        <div class="dev-section-title" style="margin-top:16px">RELAY URL</div>
        <div class="dev-url-row">
          <input type="url" id="dev-relay-url" placeholder="https://your-ngrok-url" />
          <button id="dev-set-relay-btn" class="dev-btn">SET RELAY</button>
        </div>

        <div id="dev-status" class="dev-status">Status: idle</div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       GLOBAL TOAST
  ════════════════════════════════════════════════ -->
  <div id="toast" class="toast"></div>

  <!-- ═══════════════════════════════════════════════
       IMPORTMAP — Three.js from CDN
  ════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <!-- Entry point -->
  <script type="module" src="app.js"></script>
</body>
</html>
